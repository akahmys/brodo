# The gate on GitHub Actions (ADR-0034). Started by each push to `main` and by hand; never
# by a pull request, so that no fork's code runs here. The local list of forbidden sources
# and the personal rules stay on the owner's machine, so the gate skips those two checks
# here and says so; the run before a push, on that machine, still holds them.
name: audit

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Every action is pinned to a commit, the release it came from named beside it (ADR-0034).

jobs:
  gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole history, for the gate's scan of it.
          fetch-depth: 0
      - name: Tools, at the versions the owner's machine runs
        run: |
          rustup toolchain install
          cargo install --locked cargo-deny@0.20.2 cargo-mutants@27.1.0
          # betterleaks 1.9.0, its release archive checked against the checksum it was
          # published with (2026-10-24), as the owner's machine runs it.
          curl -sSfL -o betterleaks.tar.gz https://github.com/betterleaks/betterleaks/releases/download/v1.9.0/betterleaks_1.9.0_linux_x64.tar.gz
          echo "f8b185a39ffcece2a1ca82bf3a4e7435cd81963ffd16b7a9128daf75f35f6de7  betterleaks.tar.gz" | sha256sum -c -
          mkdir -p "$HOME/.local/bin" betterleaks-unpacked
          tar -xzf betterleaks.tar.gz -C betterleaks-unpacked
          install "$(find betterleaks-unpacked -name betterleaks -type f | head -1)" "$HOME/.local/bin/betterleaks"
          rm -rf betterleaks.tar.gz betterleaks-unpacked
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          git config core.hooksPath scripts/hooks
      - name: Gate
        run: ./scripts/audit/verify_compliance.sh
