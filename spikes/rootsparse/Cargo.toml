# Throwaway spike for B-025 (ROADMAP.md §3). Never imported by `crates/` (PLANNING.md §3);
# its own workspace, so cargo does not look for it in the one above.
[package]
name = "rootsparse-spike"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
brodo = { path = "../../crates/brodo", default-features = false }

[dev-dependencies]
proptest = "1.12.0"

[workspace]
members = ["."]

[profile.release]
debug = false
