# Throwaway spike for B-023, Hermite data held sparsely (ROADMAP.md §3). Never imported by
# `crates/` (PLANNING.md §3); its own workspace, so cargo does not look for it in the one
# above.
[package]
name = "hermitesparse-spike"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
brodo = { path = "../../crates/brodo", default-features = false }

[profile.release]
debug = false

[workspace]
members = ["."]
