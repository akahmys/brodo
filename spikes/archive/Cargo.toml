# Throwaway spike for B-005 (ROADMAP.md §3). Never imported by `crates/` (PLANNING.md §3);
# its own workspace, so cargo does not look for it in the one above. `zstd` binds the C
# library, against CODING.md Rule 12: the human allowed it here as a yardstick only
# (2026-10-28).
[package]
name = "archive-spike"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
brodo = { path = "../../crates/brodo", default-features = false }
colino = { path = "../../crates/colino", default-features = false }
rayon = "=1.12.0"
ruzstd = "=0.9.1"
lz4_flex = "=0.14.0"
miniz_oxide = "=0.9.1"
zstd = "=0.14.3"
zerocopy = { version = "=0.8.63", features = ["derive"] }

[profile.release]
debug = false

[workspace]
members = ["."]
