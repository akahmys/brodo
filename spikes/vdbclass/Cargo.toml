# Throwaway spike for D5 (ROADMAP.md P9): whether OpenVDB's level sets meet the conditions
# under which brodo's reader would state the SDF convention. Never imported by `crates/`
# (PLANNING.md §3); its own workspace, so cargo does not look for it in the one above.
[package]
name = "vdbclass-spike"
version = "0.0.0"
edition = "2024"
publish = false

[dependencies]
brodo = { path = "../../crates/brodo", default-features = false, features = ["vdb"] }

[profile.release]
debug = false

[workspace]
members = ["."]
