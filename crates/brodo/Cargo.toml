[package]
name = "brodo"
description = "Sparse volumes in pure Rust: a VDB-style sparse tree, fields that share a topology, and zero-copy grid files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
readme = "README.md"

[dependencies]
lz4_flex = { workspace = true, optional = true }
memmap2 = { workspace = true, optional = true }
png = { workspace = true, optional = true }
rayon.workspace = true
thiserror.workspace = true
zerocopy.workspace = true

[features]
default = ["mmap"]
# Writing and reading the archive profile (ARCHITECTURE.md §4.7, ADR-0016); opted into
# (ADR-0036), so that `lz4_flex` reaches only a user who asks for it.
archive = ["dep:lz4_flex"]
# Reading a cache file by memory mapping (ARCHITECTURE.md §4.7, ADR-0008); on by default,
# left out with the unsafe module by a user who never maps (ADR-0036).
mmap = ["dep:memmap2"]
# The checking output's slices as PNG (ARCHITECTURE.md §6.1, ADR-0018); opted into
# (ADR-0036), the gate covering it with every feature.
slice-png = ["dep:png"]
# The checking output's field as one ASCII .vtu (ARCHITECTURE.md §6.1, ADR-0018); opted
# into (ADR-0036).
vtk = []

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true

# The slice's examples run as tests (ROADMAP.md, P1).
[[example]]
name = "diffusion"
test = true

[[example]]
name = "spheres"
test = true

[[test]]
name = "slice_images"
required-features = ["slice-png"]

[[test]]
name = "vtk_reference"
required-features = ["vtk"]

[[test]]
name = "cache_format"
required-features = ["mmap"]

# The Benchmark tier on brodo's own harness (TESTING.md §1, ADR-0019).
[[bench]]
name = "brodo"
harness = false
required-features = ["mmap"]
