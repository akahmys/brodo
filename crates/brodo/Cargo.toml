[package]
name = "brodo"
description = "Sparse volumes in pure Rust: a VDB-style sparse tree, fields that share a topology, and zero-copy grid files"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
readme = "README.md"

[dependencies]
memmap2.workspace = true
png = { workspace = true, optional = true }
rayon.workspace = true
thiserror.workspace = true
zerocopy.workspace = true

[features]
default = ["slice-png", "vtk"]
# The checking output's slices as PNG (ARCHITECTURE.md §6.1, ADR-0018); on by default, so
# that the gate's tests cover it.
slice-png = ["dep:png"]
# The checking output's field as one ASCII .vtu (ARCHITECTURE.md §6.1, ADR-0018); on by
# default, so that the gate's tests cover it.
vtk = []

[dev-dependencies]
proptest.workspace = true

[lints]
workspace = true

# The slice's examples run as tests (ROADMAP.md, P1).
[[example]]
name = "diffusion"
test = true

[[example]]
name = "spheres"
test = true

# The Benchmark tier on brodo's own harness (TESTING.md §1, ADR-0019).
[[bench]]
name = "brodo"
harness = false
