[package]
name = "colino"
description = "Converts triangle meshes to narrow-band signed distance fields (SDF) on brodo's sparse volumes, and reports topology changes"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
readme = "README.md"

[dependencies]
brodo.workspace = true
miniz_oxide.workspace = true
quick-xml.workspace = true
rawzip.workspace = true
serde = { workspace = true, optional = true }
thiserror.workspace = true

[features]
# The topology report as plain data serialisable with serde (ARCHITECTURE.md §5.2,
# ADR-0028); off by default.
serde = ["dep:serde"]

[dev-dependencies]
proptest.workspace = true
rayon.workspace = true
serde_json.workspace = true

[lints]
workspace = true

# The examples run as tests (ROADMAP.md, P2).
[[example]]
name = "torus"
test = true

[[example]]
name = "vent"
test = true

# The Benchmark tier on brodo's harness (TESTING.md §1, ADR-0019).
[[bench]]
name = "colino"
harness = false
