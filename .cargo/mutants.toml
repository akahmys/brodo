# The mutants excluded from the milestone-close run as equivalent, and nothing else; the
# run's settings are in `scripts/audit/mutants.py` (TESTING.md T11, ADR-0023).

# Mutants no test can tell from the original. Each pattern has a comment above it saying
# why, and matches at least one mutant (`scripts/audit/mutants.py`). Leave line numbers
# out of a pattern, so that it survives an edit above it.
exclude_re = [
    # `cell()` skips 13, so `26 - cell()` is never 13 and `<` and `<=` agree.
    'manifest\.rs:.*: replace < with <= in Offset::opposite$',
    # x, y and z are each masked to `dim_log2` bits and shifted apart, so they share no
    # bit and `|` and `^` agree.
    'tree\.rs:.*: replace \| with \^ in child_place$',
]
